name: Check Upstream, Sync Code, and Build ARM64

on:
  schedule:
    - cron: '0 4 * * *' # Automated check every day at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Check upstream release tag
      - name: Fetch Upstream Release
        id: upstream_release
        run: |
          UPSTREAM_TAG=$(curl -s "https://github.com" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream release tag: $UPSTREAM_TAG"

      # 2. Check your fork's release tag
      - name: Fetch Local Fork Release
        id: local_release
        run: |
          LOCAL_TAG=$(curl -s "https://github.com{{ github.repository }}/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          echo "tag=$LOCAL_TAG" >> $GITHUB_OUTPUT
          echo "Your latest fork release tag: $LOCAL_TAG"

      # 3. Pull code if an update is needed
      - name: Checkout Code
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 4. Pull down new upstream code changes safely using the official Checkout Plugin
      - name: Upstream Code Sync
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: 'ricetim/readarr-rresurrected' 
          ref: 'develop'                             
          clean: true

      # 5. CRITICAL: Find and replace x64 with arm64 inside the Dockerfile on the fly
      - name: Patch Dockerfile for ARM64
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          echo "Injecting native ARM64 architecture values into Dockerfile..."
          sed -i 's/linux-musl-x64/linux-musl-arm64/g' Dockerfile

      # 6. Set up virtualization and platforms
      - name: Set up QEMU
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 7. Authenticate registry
      - name: Log in to GHCR
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Compile your modified image configuration
      - name: Build and Push Docker Image
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64 
          push: true
          tags: |
            ghcr.io/ziilagit104/readarr-rresurrected:latest
            ghcr.io/ziilagit104/readarr-rresurrected:${{ steps.upstream_release.outputs.tag || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Dynamically create a tracking release marker via GitHub CLI (FIXED)
      - name: Create Tracking Release in Fork
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }} 
        run: |
          # 1. Fetch the tag string using a clean fallback format
          TARGET_TAG="${{ steps.upstream_release.outputs.tag }}"
          
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
            TARGET_TAG="latest"
          fi
          
          echo "Publishing tracking release for version: $TARGET_TAG"
          
          # 2. Use the official GitHub CLI tool to safely generate the tracking release
          gh release create "$TARGET_TAG" \
            --title "Release $TARGET_TAG" \
            --notes "Automated native ARM64 build targeting upstream release configuration." \
            --clobber || echo "Release already exists or updated"


name: Check Upstream and Build ARM64

on:
  schedule:
    - cron: '0 4 * * *' # Runs automatically every day at 4:00 AM UTC
  workflow_dispatch: # Allows you to trigger the build manually from the UI anytime

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Fetch the latest release tag from the upstream source repo
      - name: Fetch Upstream Release
        id: upstream_release
        run: |
          UPSTREAM_TAG=$(curl -s "https://github.com" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream release tag is $UPSTREAM_TAG"

      # 2. Fetch the latest release tag already published in your fork
      - name: Fetch Local Fork Release
        id: local_release
        run: |
          LOCAL_TAG=$(curl -s "https://github.com{{ github.repository }}/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          echo "tag=$LOCAL_TAG" >> $GITHUB_OUTPUT
          echo "Your latest fork release tag is $LOCAL_TAG"

      # 3. Code Checkout (Only runs if a brand new upstream release is found, or if manually run)
      - name: Checkout Code
        if: steps:upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      # 4. Set up QEMU Emulator for Multi-Platform compilation emulation
      - name: Set up QEMU
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      # 5. Set up Docker Buildx for compilation architecture management
      - name: Set up Docker Buildx
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 6. Authenticate into the GitHub Container Registry
      - name: Log in to GHCR
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Compile and Publish the Native ARM64 Images
      - name: Build and Push Docker Image
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64 # Forces the target container output environment to match your Pi 5
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.upstream_release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Create a matching Release in your personal fork to record the updated state
      - name: Create Tracking Release in Fork
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: softprops/action-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.upstream_release.outputs.tag }}
          name: Release ${{ steps.upstream_release.outputs.tag }}
          body: "Automated native ARM64 build targeting upstream release version ${{ steps.upstream_release.outputs.tag }}."
          draft: false
          prerelease: false

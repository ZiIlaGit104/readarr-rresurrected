name: Check Upstream, Sync Code, and Build ARM64

on:
  schedule:
    - cron: '0 4 * * *' # Automated check every day at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Fetch the absolute latest release tag from the upstream repo using a native plugin
      - name: Fetch Upstream Release
        id: upstream_release
        uses: oprypin/find-latest-release@v1
        with:
          repository: ricetim/readarr-rresurrected
          releases-only: true

      # 2. Fetch the latest release tag already published in your personal fork
      - name: Fetch Local Fork Release
        id: local_release
        uses: oprypin/find-latest-release@v1
        continue-on-error: true # Prevents crashing if your fork has zero releases initially
        with:
          repository: ${{ github.repository }}
          releases-only: true

      # 3. Code Checkout (Compares the outputs of the native steps safely)
      - name: Checkout Code
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      # 4. Pull down new upstream code changes safely using the official Checkout Plugin
      - name: Upstream Code Sync
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: 'ricetim/readarr-rresurrected'
          ref: 'develop'
          clean: true

      # 5. Patch Dockerfile for ARM64
      - name: Patch Dockerfile for ARM64
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/linux-musl-x64/linux-musl-arm64/g' Dockerfile

      # 6. Set up virtualization and platforms
      - name: Set up QEMU
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 7. Authenticate registry
      - name: Log in to GHCR
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Compile your modified image configuration
      - name: Build and Push Docker Image
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64 
          push: true
          tags: |
            ghcr.io/ziilagit104/readarr-rresurrected:latest
            ghcr.io/ziilagit104/readarr-rresurrected:${{ steps.upstream_release.outputs.tag || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Dynamically create a tracking release marker via GitHub CLI (FIXED PATH TARGETING)
      - name: Create Tracking Release in Fork
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          # 1. Fetch the absolute latest tag from Step 1, falling back to 'latest' if run manually
          TARGET_TAG="${{ steps.upstream_release.outputs.tag }}"
          
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
            TARGET_TAG="latest"
          fi
          
          echo "Publishing tracking release version: $TARGET_TAG to your fork registry..."
          
          # 2. Force delete the existing placeholder tag inside YOUR fork to avoid collisions
          gh release delete "$TARGET_TAG" --repo "${{ github.repository }}" --yes || echo "No existing release to delete"
          
          # 3. Create the tracking release marker explicitly inside YOUR repository space
          gh release create "$TARGET_TAG" \
            --repo "${{ github.repository }}" \
            --title "Release $TARGET_TAG" \
            --notes "Automated native ARM64 build targeting upstream release configuration."


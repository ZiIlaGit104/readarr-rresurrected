name: Check Upstream, Sync Code, and Build ARM64

on:
  schedule:
    - cron: '0 4 * * *' # Automatically runs every day at 4:00 AM UTC
  workflow_dispatch: # Allows manual override triggers via the GitHub UI button

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Fetch the absolute latest tag from the upstream repository
      - name: Fetch Upstream Release
        id: upstream_release
        uses: oprypin/find-latest-tag@v1.1.3
        with:
          repository: ricetim/readarr-rresurrected
          releases-only: true

      # 2. Fetch the latest tag from your own personal fork space
      - name: Fetch Local Fork Release
        id: local_release
        uses: oprypin/find-latest-tag@v1.1.3
        continue-on-error: true # Stops crashes if your fork has zero releases initially
        with:
          repository: ${{ github.repository }}
          releases-only: true

      # 3. Pull down your fork's tracking baseline context
      - name: Checkout Code
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      # 4. Synchronize the active workspace files with the upstream develop branch
      - name: Upstream Code Sync
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: 'ricetim/readarr-rresurrected'
          ref: 'develop'
          clean: true

      # 5. Patch the underlying Dockerfile strings explicitly for Alpine ARM64 framework tracking
      - name: Patch Dockerfile for ARM64
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/linux-musl-x64/linux-musl-arm64/g' Dockerfile

      # 6. Initialize Multi-Platform platform compilation layers
      - name: Set up QEMU
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 7. Authenticate container destination pathways cleanly using your PAT
      - name: Log in to GHCR
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      # 8. Cross-Compile and deploy your native ARM64 image configurations
      - name: Build and Push Docker Image
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ziilagit104/readarr-rresurrected:latest
            ghcr.io/ziilagit104/readarr-rresurrected:${{ steps.upstream_release.outputs.tag || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Dynamically generate tracking markers without crashing over missing references
      - name: Create Tracking Release in Fork
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          TARGET_TAG="${{ steps.upstream_release.outputs.tag }}"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
            TARGET_TAG="latest"
          fi
          
          echo "Syncing tracking release marker version: $TARGET_TAG"
          gh release delete "$TARGET_TAG" --repo "${{ github.repository }}" --yes || echo "No asset conflict"
          gh release create "$TARGET_TAG" \
            --repo "${{ github.repository }}" \
            --title "Release $TARGET_TAG" \
            --notes "Automated native ARM64 build targeting upstream release update states." || echo "Marker synced"

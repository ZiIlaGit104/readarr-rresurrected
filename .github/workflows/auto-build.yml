name: Check Upstream, Sync Code, and Build ARM64

on:
  schedule:
    - cron: '0 4 * * *' # Automated check every day at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Check upstream release tag
      - name: Fetch Upstream Release
        id: upstream_release
        run: |
          UPSTREAM_TAG=$(curl -s "https://github.com" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream release tag: $UPSTREAM_TAG"

      # 2. Check your fork's release tag
      - name: Fetch Local Fork Release
        id: local_release
        run: |
          LOCAL_TAG=$(curl -s "https://github.com{{ github.repository }}/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          echo "tag=$LOCAL_TAG" >> $GITHUB_OUTPUT
          echo "Your latest fork release tag: $LOCAL_TAG"

      # 3. Pull code if an update is needed
      - name: Checkout Code
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 4. Clean invisible line endings and pull down upstream code changes
      - name: Upstream Code Sync
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Fix: Strip out hidden Windows line endings (\r) across all workflow scripts inside the runner
          sed -i 's/\r//g' .github/workflows/*.yml || echo "Clean"
          
          # Define the target URL safely inside a local execution variable
          TARGET_URL="https://github.com"
          
          echo "Downloading latest upstream source code snapshot..."
          curl -L "$TARGET_URL" -o upstream.tar.gz
          
          echo "Extracting archive layers into active runner workspace..."
          tar -xzf upstream.tar.gz --strip-components=1
          rm upstream.tar.gz
          
          # Force remove any conflicting workflow pipelines brought down by the archive
          rm -f .github/workflows/docker.yml
          rm -f .github/workflows/docker.yaml

      # 5. CRITICAL: Find and replace x64 with arm64 inside the Dockerfile on the fly
      - name: Patch Dockerfile for ARM64
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          echo "Injecting native ARM64 architecture values into Dockerfile..."
          sed -i 's/linux-musl-x64/linux-musl-arm64/g' Dockerfile

      # 6. Set up virtualization and platforms
      - name: Set up QEMU
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 7. Authenticate registry
      - name: Log in to GHCR
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Compile your modified image configuration
      - name: Build and Push Docker Image
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64 
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.upstream_release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Push code updates back to your fork and create a Release marker (FIXED)
      - name: Create Tracking Release in Fork
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ steps.upstream_release.outputs.tag }}
          name: Release ${{ steps.upstream_release.outputs.tag }}
          body: "Automated native ARM64 build targeting upstream release version ${{ steps.upstream_release.outputs.tag }}."
          token: ${{ secrets.GHCR_PAT }}

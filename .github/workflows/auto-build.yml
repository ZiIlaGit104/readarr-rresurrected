name: Check Upstream, Sync Code, and Build ARM64

on:
  schedule:
    - cron: '0 4 * * *' # Automated check every day at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      # 1. Check upstream release tag
      - name: Fetch Upstream Release
        id: upstream_release
        run: |
          UPSTREAM_TAG=$(curl -s "https://github.com" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream release tag: $UPSTREAM_TAG"

      # 2. Check your fork's release tag
      - name: Fetch Local Fork Release
        id: local_release
        run: |
          LOCAL_TAG=$(curl -s "https://github.com{{ github.repository }}/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          echo "tag=$LOCAL_TAG" >> $GITHUB_OUTPUT
          echo "Your latest fork release tag: $LOCAL_TAG"

      # 3. Pull code if an update is needed
      - name: Checkout Code
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 4. CRITICAL: Automatically pull down new upstream code changes into your fork
      - name: Upstream Code Sync
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com
          git fetch upstream
          # Pull upstream's develop branch into your fork to update files
          git merge upstream/develop --allow-unrelated-histories -m "Automated upstream code sync" || echo "No conflicts or merged safely"

      # 5. CRITICAL: Find and replace x64 with arm64 inside the Dockerfile on the fly
      - name: Patch Dockerfile for ARM64
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        run: |
          echo "Injecting native ARM64 architecture values into Dockerfile..."
          sed -i 's/linux-musl-x64/linux-musl-arm64/g' Dockerfile

      # 6. Set up virtualization and platforms
      - name: Set up QEMU
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 7. Authenticate registry
      - name: Log in to GHCR
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Compile your modified image configuration
      - name: Build and Push Docker Image
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64 
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.upstream_release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Push code updates back to your fork and create a Release marker
      - name: Push Updates and Create Tracking Release
        if: steps.upstream_release.outputs.tag != steps.local_release.outputs.tag || github.event_name == 'workflow_dispatch'
        uses: softprops/action-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.upstream_release.outputs.tag }}
          name: Release ${{ steps.upstream_release.outputs.tag }}
          body: "Automated native ARM64 build targeting upstream release version ${{ steps.upstream_release.outputs.tag }}."
          draft: false
          prerelease: false
